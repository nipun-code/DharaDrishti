# Development stack: docker compose up --build
# Requires a .env file (copy .env.example to .env and fill in values).

x-backend-env: &backend-env
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set POSTGRES_USER in .env}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:?set POSTGRES_DB in .env}
  REDIS_URL: redis://redis:6379/0
  # Container paths (override host-oriented values that may be in .env).
  UPLOAD_DIR: /uploads
  DATA_DIR: /data
  HF_HOME: /models
  # Bind mounts from Windows/macOS hosts don't emit inotify events; poll so --reload works.
  WATCHFILES_FORCE_POLLING: "true"

services:
  postgres:
    restart: unless-stopped
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    restart: unless-stopped
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend-env
    command: >
      uvicorn app.main:create_app --factory --host 0.0.0.0 --port 8000
      --reload --reload-dir app --no-access-log
    ports:
      - "${API_PORT:-8000}:8000"
    volumes: &backend-volumes
      - ./backend:/app
      - /app/.venv # keep a host-side virtualenv out of the container
      - uploads:/uploads # uploaded PDFs, shared with the worker
      - hf_models:/models # embedding model cache (downloaded once)
      - ./data:/data:ro # user-provided data: raw PDFs, mappings CSV, eval set
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    restart: unless-stopped
    build:
      context: ./backend
    env_file:
      - path: .env
        required: false
    environment:
      <<: *backend-env
    command: ["python", "-m", "app.workers.worker"]
    healthcheck:
      disable: true
    volumes: *backend-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    restart: unless-stopped
    build:
      context: ./frontend
    environment:
      VITE_API_PROXY_TARGET: http://api:8000
      VITE_USE_POLLING: "true"
    # node_modules lives in an anonymous volume that survives rebuilds, so sync it on start
    # (fast no-op when package-lock.json hasn't changed).
    command: sh -c "npm install --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules # use the container's node_modules, not the host's
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  uploads:
  hf_models:
