[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "dharadrishti"
version = "0.1.0"
description = "AI legal research assistant for Indian statutes (hybrid RAG)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.3",
    "redis>=5.0",
    "arq>=0.26",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
    "email-validator>=2.2",
]

[project.optional-dependencies]
# Heavy ML / parsing deps (torch etc.). Installed from the ingestion/retrieval phases onward.
ml = [
    "sentence-transformers>=3.0",
    "pymupdf>=1.24",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF",
    "ASYNC", "S", "PT", "RET", "PL", "TRY", "BLE", "T20",
]
ignore = [
    "TRY003",   # long messages in exception constructors are fine
    "PLR0913",  # FastAPI dependencies naturally take many args
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "PLR2004", "RUF001", "ASYNC240"]
# These modules match en/em dashes used in bare-act headings on purpose.
"app/services/ingestion/{legal_chunker,pdf_parser}.py" = ["RUF001"]

[tool.ruff.format]
quote-style = "double"

# ---------------------------------------------------------------- mypy
[tool.mypy]
python_version = "3.11"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
files = ["app"]

[[tool.mypy.overrides]]
module = ["arq.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Heavy ML libraries: don't analyse them (torch alone takes many minutes); treat as Any.
module = ["sentence_transformers.*", "torch.*", "transformers.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# PyMuPDF's bindings are only partially annotated.
module = ["pymupdf.*", "app.services.ingestion.pdf_parser"]
disallow_untyped_calls = false

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--strict-markers --cov=app --cov-report=term-missing --cov-fail-under=80"
markers = [
    "integration: needs running PostgreSQL and Redis (skipped automatically if unreachable)",
]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
